    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 85% 12%, rgba(200, 178, 245, 0.16), transparent 42%),
        radial-gradient(circle at 15% 88%, rgba(242, 156, 184, 0.16), transparent 45%),
        var(--flores-bg),
        var(--fondo-oscuro);
      background-size: auto, auto, 320px 320px, auto;
      color: var(--texto-claro);
      line-height: 1.6;
      font-size: clamp(16px, 1.15vw, 19px);

    .barra-superior {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(10px);
      background: rgba(22, 16, 24, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 14px clamp(16px, 4vw, 36px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .marca {
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .marca span {
      color: #f8b8ce;
    }

    .nav-enlaces {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .nav-enlaces a.enlace-suave {
      color: #f4eaf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .nav-enlaces a.enlace-suave:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-asistente {
      display: inline-block;
      background: linear-gradient(135deg, #ff4d82 0%, #d9265c 55%, #f4a261 135%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(225, 75, 120, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-asistente:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .contenedor {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 32px) clamp(14px, 3vw, 28px) 64px;
    }

    .portada {
      background: linear-gradient(145deg, rgba(35, 22, 38, 0.96), rgba(22, 15, 26, 0.97));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: clamp(24px, 4vw, 44px);
      margin-bottom: 28px;
      box-shadow: 0 20px 46px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
      align-items: center;
    }

    .etiqueta {
      display: inline-block;
      background: rgba(242, 156, 184, 0.22);
      border: 1px solid rgba(200, 178, 245, 0.5);
      color: #f8e9f2;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4.2vw, 3.4rem);
      line-height: 1.12;
    }

    h1 span {
      background: linear-gradient(135deg, #f8b8ce 0%, #fff4db 50%, #d4c0ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .portada p {
      margin: 0 0 22px;
      font-size: clamp(1.08rem, 1.45vw, 1.28rem);
      color: #f2eaf6;
    }

    .insignias {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .insignia {
      color: var(--texto-oscuro);
      font-weight: 800;
      font-size: 1rem;
      padding: 10px 16px;
      border-radius: 999px;
    }

    .bg-lila  { background: var(--lila);  color: var(--texto-oscuro); }

      margin-bottom: 34px;
